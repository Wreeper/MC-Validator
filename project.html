function b64ToBuf(b64) {
  const bin = atob(b64.replace(/-/g, '+').replace(/_/g, '/'));
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf.buffer;
}

async function importKey(b64) {
  return crypto.subtle.importKey(
    "spki",
    b64ToBuf(b64),
    { name: "RSASSA-PKCS1-v1_5", hash: "SHA-1" },
    false,
    ["verify"]
  );
}

async function verifySignature(valueB64, signatureB64) {
  const data = new TextEncoder().encode(valueB64);
  const sig  = b64ToBuf(signatureB64);

  for (const [category, keys] of Object.entries(keyCategories)) {
    for (let i = 0; i < keys.length; i++) {
      try {
        const key = await importKey(keys[i]);
        const ok = await crypto.subtle.verify(
          { name: "RSASSA-PKCS1-v1_5" },
          key,
          sig,
          data
        );
        if (ok) return { valid: true };
      } catch (e) { /* try next key */ }
    }
  }
  return { valid: false };
}

async function checkSignature() {
  const value = document.getElementById('valueInput').value.trim();
  const signature = document.getElementById('sigInput').value.trim();
  const msg = document.getElementById('messageresponse');

  msg.className = '';
  msg.innerHTML = 'checking...';

  if (!value || !signature) {
    msg.className = 'failure';
    msg.innerHTML = 'You haven\'t provided a value and signature to be checked!';
    return;
  }

  try {
    const result = await verifySignature(value, signature);

    if (!result.valid) {
      msg.className = 'failure';
      msg.innerHTML = 'The provided signature is invalid.';
      return;
    }

    const jsonStr = atob(value);
    const data = JSON.parse(jsonStr);

    const playername = data.profileName || '';
    const uuid = data.profileId || '';
    const timestamp = Math.floor((data.timestamp || 0) / 1000);

    let skinid = '';
    let capeid = '';
    if (data.textures) {
      if (data.textures.SKIN && data.textures.SKIN.url) {
        skinid = data.textures.SKIN.url
          .replace('http://textures.minecraft.net/texture/', '')
          .replace('https://textures.minecraft.net/texture/', '');
      }
      if (data.textures.CAPE && data.textures.CAPE.url) {
        capeid = data.textures.CAPE.url
          .replace('http://textures.minecraft.net/texture/', '')
          .replace('https://textures.minecraft.net/texture/', '');
      }
    }

    msg.className = 'success';
    let html = `<strong>The provided signature is valid.</strong>`;

    if (playername) {
      html += `<div class="info-line"><span class="label">Player:</span> ${playername}</div>`;
    }
    if (uuid) {
      html += `<div class="info-line"><span class="label">UUID:</span> ${uuid}</div>`;
    }
    if (skinid) {
      html += `<div class="info-line"><span class="label">Skin ID:</span> ${skinid}</div>`;
    }
    if (capeid) {
      html += `<div class="info-line"><span class="label">Cape ID:</span> ${capeid}</div>`;
    }
    if (timestamp) {
      const newTime = new Date(timestamp * 1000);
      const mydatehehe = `${new Intl.DateTimeFormat(navigator.language || 'en', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      }).format(newTime)} at ${new Intl.DateTimeFormat(navigator.language || 'en', {
        hour: 'numeric',
        minute: 'numeric'
      }).format(newTime)}`;
      html += `<div class="info-line"><span class="label">Date:</span> ${mydatehehe}</div>`;
    }

    msg.innerHTML = html;

  } catch (err) {
    msg.className = 'failure';
    msg.innerHTML = 'Something went wrong while checking the signature.';
    console.error(err);
  }
}
